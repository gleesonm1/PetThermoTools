name: Test and publish to PyPI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  release:
    types: [ created ]

# A newer push to the same pull request makes an older, still-running run
# pointless, so cancel it. Never cancel runs on master or for a release: every
# merge and every release must be tested to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Tier A only (see Unit_tests/conftest.py): pure-Python tests with no
    # alphaMELTS or Julia dependency. Any Tier B (integration) test added
    # under Unit_tests/integration/ auto-skips here, since neither backend
    # is installed on these runners -- MELTS/MAGEMin integration tests stay
    # local-only for now, by team decision.
    runs-on: ${{ matrix.os }}
    # A healthy job takes about 5 minutes (the suite itself ~2 min); 60 leaves
    # generous headroom for slow runners and queued installs. The default limit
    # is 6 hours, so a hung test (this suite spawns processes, and several tests
    # deliberately provoke hangs) would otherwise hold a runner for hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        # '' = whatever pip resolves. pandas 3 needs Python >= 3.11, so the plain
        # matrix runs pandas 2 on 3.10 and pandas 3 on 3.11+, and never pandas 2 on
        # a newer Python (common on shared JupyterHub images). The include below
        # adds that one combination as an extra job.
        pandas: ['']
        include:
          - os: ubuntu-latest
            python-version: '3.12'
            pandas: '<3'

    steps:
    - uses: actions/checkout@v4

    - name: 'Set up Python ${{matrix.python-version}}'
      uses: actions/setup-python@v2
      with:
        python-version: ${{matrix.python-version}}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        

    - name: Install my package
      run: |
        python -m pip install .

    - name: Pin pandas (extra matrix job only)
      if: matrix.pandas != ''
      run: |
        python -m pip install "pandas${{ matrix.pandas }}"
        python -c "import pandas; print('pandas', pandas.__version__)"

    - name: Install test dependencies
      run: |
        pip install flake8 pytest coverage

    - name: Test with pytest
      run: |
        coverage run -m pytest

    - name: Clean up coverage data
      shell: bash
      run: |
        # This is a workaround for the fact that the `[coverage:paths]` section
        # of `setup.cfg` is not actually applies until we run `combine`; so we
        # rename the report such that we can then "combine" it.
        # shell: bash pins this to Git Bash on windows-latest too, so `mv`
        # behaves identically across the new os matrix instead of relying on
        # pwsh's Move-Item alias.
        mv .coverage .coverage.hack
        coverage combine
        coverage report

    - uses: codecov/codecov-action@v1

    # - name: Build
    #   run: |
    #     python setup.py sdist bdist_wheel




  # One stable check that summarises the whole test matrix. Require THIS check
  # in the branch protection rule for master, instead of listing every matrix
  # job by name (those names change whenever the matrix does). `if: always()`
  # makes it run, and fail, even when the matrix failed or was cancelled; a
  # skipped required check would count as passing.
  tests-passed:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Require every test job to have succeeded
      run: |
        echo "result of the test matrix: ${{ needs.test.result }}"
        test "${{ needs.test.result }}" = "success"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: deploy
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python '3.8'
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    - name: "Install"
      run: |
        python -m pip install --upgrade pip;
        python -m pip install build
        pip install setuptools wheel twine
        python setup.py sdist bdist_wheel
        
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist

#     - name: Publish to Test PyPI (always)
#       uses: pypa/gh-action-pypi-publish@master
#       with:
#         user: __token__
#         password: ${{ secrets.test_pypi_password }}
#         repository_url: https://test.pypi.org/legacy/

    - name: Publish to PyPI (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.pypi_token }}


